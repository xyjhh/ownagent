services:
  api:
    build: .
    env_file: .env
    environment:
      # Containers must use the Compose service name, not their own localhost.
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: http://host.docker.internal:54321
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      EMBEDDING_BASE_URL: http://host.docker.internal:8002/v1
      RERANK_URL: http://host.docker.internal:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8787:8787"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "dist/src/worker.js"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: http://host.docker.internal:54321
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      EMBEDDING_BASE_URL: http://host.docker.internal:8002/v1
      RERANK_URL: http://host.docker.internal:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2

  document-worker:
    build: .
    command: ["node", "dist/src/document-worker.js"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: http://host.docker.internal:54321
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      EMBEDDING_BASE_URL: http://host.docker.internal:8002/v1
      RERANK_URL: http://host.docker.internal:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  memory-worker:
    build: .
    command: ["node", "dist/src/memory-worker.js"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: http://host.docker.internal:54321
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      EMBEDDING_BASE_URL: http://host.docker.internal:8002/v1
      RERANK_URL: http://host.docker.internal:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >-
      sh -c "exec redis-server --appendonly yes
      --maxmemory \"$${REDIS_MAXMEMORY:-512mb}\"
      --maxmemory-policy \"$${REDIS_MAXMEMORY_POLICY:-noeviction}\""
    environment:
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-512mb}
      REDIS_MAXMEMORY_POLICY: ${REDIS_MAXMEMORY_POLICY:-noeviction}
    volumes:
      - ownagent-redis:/data
    ports:
      # Also allows npm run dev / npm run dev:worker on the host to use this Redis.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  ownagent-redis:
