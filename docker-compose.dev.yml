name: ownagent-dev

services:
  ownagent-dev-redis:
    image: redis:7.4.2-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-noeviction}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - ownagent-dev-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  langfuse-dev-postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?Set up the dev environment first}
      POSTGRES_DB: langfuse
    volumes:
      - ownagent-dev-langfuse-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-dev-clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39-alpine
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Set up the dev environment first}
    volumes:
      - ownagent-dev-langfuse-clickhouse:/var/lib/clickhouse
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-dev-redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD:?Set up the dev environment first}"]
    environment:
      LANGFUSE_REDIS_PASSWORD: ${LANGFUSE_REDIS_PASSWORD:?Set up the dev environment first}
    volumes:
      - ownagent-dev-langfuse-redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${LANGFUSE_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  langfuse-dev-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ROOT_USER:?Set up the dev environment first}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD:?Set up the dev environment first}
    volumes:
      - ownagent-dev-langfuse-minio:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-dev-minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      langfuse-dev-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ROOT_USER:?Set up the dev environment first}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD:?Set up the dev environment first}
    entrypoint: >-
      /bin/sh -c "mc alias set local http://langfuse-dev-minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/langfuse-events"

  langfuse-dev-web:
    image: langfuse/langfuse:3.225.2
    restart: unless-stopped
    depends_on:
      langfuse-dev-postgres:
        condition: service_healthy
      langfuse-dev-clickhouse:
        condition: service_healthy
      langfuse-dev-redis:
        condition: service_healthy
      langfuse-dev-minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3002:3000"
    environment: &langfuse-dev-environment
      NODE_ENV: production
      NEXTAUTH_URL: http://127.0.0.1:3002
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Set up the dev environment first}
      SALT: ${LANGFUSE_SALT:?Set up the dev environment first}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Set up the dev environment first}
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-dev-postgres:5432/langfuse
      DIRECT_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-dev-postgres:5432/langfuse
      CLICKHOUSE_MIGRATION_URL: clickhouse://default:${LANGFUSE_CLICKHOUSE_PASSWORD}@langfuse-dev-clickhouse:9000/default
      CLICKHOUSE_URL: http://langfuse-dev-clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://:${LANGFUSE_REDIS_PASSWORD}@langfuse-dev-redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-dev-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_INIT_ORG_ID: ownagent-dev
      LANGFUSE_INIT_ORG_NAME: OwnAgent Development
      LANGFUSE_INIT_PROJECT_ID: ownagent-dev
      LANGFUSE_INIT_PROJECT_NAME: ownagent-dev
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Set up the dev environment first}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Set up the dev environment first}
      LANGFUSE_INIT_USER_EMAIL: ${ADMIN_EMAIL:?Set up the dev environment first}
      LANGFUSE_INIT_USER_NAME: OwnAgent Developer
      LANGFUSE_INIT_USER_PASSWORD: ${ADMIN_PASSWORD:?Set up the dev environment first}
      TELEMETRY_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://langfuse-dev-web:3000/api/public/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  langfuse-dev-worker:
    image: langfuse/langfuse-worker:3.225.2
    restart: unless-stopped
    depends_on:
      langfuse-dev-postgres:
        condition: service_healthy
      langfuse-dev-clickhouse:
        condition: service_healthy
      langfuse-dev-redis:
        condition: service_healthy
      langfuse-dev-minio-init:
        condition: service_completed_successfully
    environment: *langfuse-dev-environment

volumes:
  ownagent-dev-redis-data:
    name: ownagent-dev-redis-data
  ownagent-dev-langfuse-postgres:
    name: ownagent-dev-langfuse-postgres
  ownagent-dev-langfuse-clickhouse:
    name: ownagent-dev-langfuse-clickhouse
  ownagent-dev-langfuse-redis:
    name: ownagent-dev-langfuse-redis
  ownagent-dev-langfuse-minio:
    name: ownagent-dev-langfuse-minio
