services:
  api:
    build: .
    env_file: .env
    ports:
      - "8787:8787"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "dist/src/worker.js"]
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2

  redis:
    image: redis:7-alpine
    command: >-
      sh -c "exec redis-server --appendonly yes
      --maxmemory \"$${REDIS_MAXMEMORY:-512mb}\"
      --maxmemory-policy \"$${REDIS_MAXMEMORY_POLICY:-noeviction}\""
    environment:
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-512mb}
      REDIS_MAXMEMORY_POLICY: ${REDIS_MAXMEMORY_POLICY:-noeviction}
    volumes:
      - ownagent-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  ownagent-redis:
